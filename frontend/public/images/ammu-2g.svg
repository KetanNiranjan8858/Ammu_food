  <g transform="translate(-40, 20) scale(0.85)">
    <rect x="135" y="170" width="230" height="235" rx="35" fill="#1C1514" stroke="#D4AF37" stroke-width="2.5"/>
    <rect x="160" y="210" width="180" height="170" rx="20" fill="#2A0F13"/>
    <rect x="155" y="125" width="190" height="50" rx="14" fill="url(#goldCap2)"/>
