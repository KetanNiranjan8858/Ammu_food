      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#881337" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#120F0D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldCap2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6D1F"/>
    </linearGradient>
    <linearGradient id="saffronThread2" x1="0%" y1="0%" x2="100%" y2="100%">
