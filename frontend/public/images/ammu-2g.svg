    <rect x="160" y="210" width="180" height="170" rx="20" fill="#2A0F13"/>
    <g stroke="url(#saffronThread2)" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M190 350 Q 200 300 230 270 Q 240 250 255 240" />
      <path d="M240 365 Q 245 320 270 290 Q 285 270 280 250" />
      <path d="M280 355 Q 300 330 310 290 Q 315 270 305 255" />
