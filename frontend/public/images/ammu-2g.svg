    <text x="250" y="322" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#D4AF37" letter-spacing="1">TWIN PACK</text>
    <text x="250" y="337" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#FFFFFF" opacity="0.8">2 x 1g = 2g NET</text>
