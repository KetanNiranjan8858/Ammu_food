<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="ambientGlow10" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#881337" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#120F0D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boxWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A151D"/>
      <stop offset="50%" stop-color="#2D0B10"/>
      <stop offset="100%" stop-color="#1A0407"/>
    </linearGradient>
    <linearGradient id="goldHinges" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6D1F"/>
    </linearGradient>
  </defs>

  <circle cx="250" cy="260" r="230" fill="url(#ambientGlow10)"/>
  <ellipse cx="250" cy="420" rx="180" ry="25" fill="#000000" opacity="0.7"/>

  <!-- Luxury Velvet/Wood Chest -->
  <rect x="80" y="160" width="340" height="230" rx="25" fill="url(#boxWood)" stroke="#D4AF37" stroke-width="3"/>
  <rect x="95" y="175" width="310" height="200" rx="18" fill="#180508" stroke="#881337" stroke-width="1.5"/>

  <!-- Gold Brass Lock / Clasp -->
  <rect x="230" y="240" width="40" height="50" rx="6" fill="url(#goldHinges)" stroke="#FFF8E1" stroke-width="1"/>
  <circle cx="250" cy="260" r="6" fill="#1A0407"/>
  <path d="M250 266 L250 278" stroke="#1A0407" stroke-width="2"/>

  <!-- Corner Brass Filigree -->
  <polygon points="95,175 135,175 95,215" fill="url(#goldHinges)"/>
  <polygon points="405,175 365,175 405,215" fill="url(#goldHinges)"/>
  <polygon points="95,375 135,375 95,335" fill="url(#goldHinges)"/>
  <polygon points="405,375 365,375 405,335" fill="url(#goldHinges)"/>

  <!-- Crest on Box -->
  <circle cx="250" cy="205" r="24" fill="#2D0B10" stroke="#D4AF37" stroke-width="2"/>
  <text x="250" y="213" text-anchor="middle" font-family="serif" font-size="22" font-weight="bold" fill="#FDD835">A</text>

  <!-- Brass Nameplate -->
  <rect x="140" y="315" width="220" height="45" rx="6" fill="url(#goldHinges)" stroke="#FFF8E1" stroke-width="1"/>
  <text x="250" y="335" text-anchor="middle" font-family="serif" font-size="14" font-weight="bold" fill="#1A0407" letter-spacing="2">AMMU FOODS</text>
  <text x="250" y="348" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="bold" fill="#1A0407" letter-spacing="1">HERITAGE GIFT BOX &bull; 10g</text>
</svg>

