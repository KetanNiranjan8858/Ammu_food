<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#881337" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#120F0D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6D1F"/>
    </linearGradient>
    <linearGradient id="glassBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="saffronThread" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="50%" stop-color="#C41C1C"/>
      <stop offset="100%" stop-color="#7A0C16"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Glow -->
  <circle cx="250" cy="260" r="220" fill="url(#ambientGlow)"/>

  <!-- Bottle Shadow -->
  <ellipse cx="250" cy="430" rx="140" ry="25" fill="#000000" opacity="0.6"/>

  <!-- Acrylic/Glass Bottle Outer Container -->
  <rect x="135" y="170" width="230" height="235" rx="35" fill="#1C1514" stroke="#D4AF37" stroke-width="2.5" opacity="0.95"/>
  <rect x="140" y="175" width="220" height="225" rx="30" fill="url(#glassBody)"/>

  <!-- Inner Crimson Saffron Chamber -->
  <rect x="160" y="210" width="180" height="170" rx="20" fill="#2A0F13" stroke="#881337" stroke-width="2"/>
  
  <!-- Saffron Threads Illustration -->
  <g stroke="url(#saffronThread)" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#glow)">
    <path d="M190 350 Q 200 300 230 270 Q 240 250 255 240" />
    <path d="M210 360 Q 225 310 215 280 Q 205 250 220 235" />
    <path d="M240 365 Q 245 320 270 290 Q 285 270 280 250" />
    <path d="M260 360 Q 280 320 260 285 Q 250 260 270 245" />
    <path d="M280 355 Q 300 330 310 290 Q 315 270 305 255" />
    <path d="M185 330 Q 220 310 250 320 Q 280 330 310 310" />
    <path d="M195 340 Q 230 340 270 310 Q 290 295 315 290" />
    <path d="M220 355 Q 260 300 240 260 Q 230 245 245 230" />
    <path d="M205 320 Q 240 290 280 275" stroke="#FFA000" stroke-width="2.5"/>
    <path d="M230 345 Q 260 315 295 285" stroke="#FFA000" stroke-width="2"/>
  </g>

  <!-- Luxury Gold Label -->
  <rect x="175" y="280" width="150" height="70" rx="8" fill="#140E0D" stroke="#D4AF37" stroke-width="1.5"/>
  <text x="250" y="303" text-anchor="middle" font-family="serif" font-size="16" font-weight="bold" fill="#FDD835" letter-spacing="3">AMMU</text>
  <text x="250" y="322" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#D4AF37" letter-spacing="2">KASHMIRI SAFFRON</text>
  <text x="250" y="337" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#FFFFFF" opacity="0.8">GRADE-1 &bull; NET WT: 1g</text>

  <!-- Golden Jar Lid / Crown -->
  <rect x="155" y="125" width="190" height="50" rx="14" fill="url(#goldCap)" stroke="#FFF8E1" stroke-width="1"/>
  <rect x="175" y="115" width="150" height="14" rx="5" fill="#B3861B"/>
  <line x1="165" y1="150" x2="335" y2="150" stroke="#8C6D1F" stroke-width="1.5" opacity="0.4"/>

  <!-- Glass Light Reflection -->
  <path d="M150 185 L 175 185 L 160 390 L 145 390 Z" fill="#ffffff" opacity="0.12"/>
</svg>

